services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:${THREEXUI_VERSION:-v3.8.5}
    ports:
      - "2053:2053" # HTTP panel
      # Subscription server port, published so acceptance tests can probe the
      # subscription endpoint after a provider-triggered panel restart
      # (see TestAccPanelSubscription_RestartsPanel / #291). Only bound when
      # the subscription server is enabled, so it is inert for other acc tests.
      - "2096:2096"
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      # Set both to activate PostgreSQL (via --profile postgres):
      #   XUI_DB_TYPE=postgres
      #   XUI_DB_DSN=postgres://xui:xui@postgres:5432/xui?sslmode=disable
      XUI_DB_TYPE: "${XUI_DB_TYPE:-}"
      XUI_DB_DSN: "${XUI_DB_DSN:-}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    tty: true
    restart: unless-stopped
    # `/` returns 200 (login page) once the gin router is up — earlier
    # than the default --wait, which only checks that the container
    # started. /login is POST-only and answers GET with 404, so we cannot
    # use it. Xray-subsystem readiness is verified separately by the test
    # runner — see Taskfile.yml `_wait-for-xray`.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2053/ >/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: 3xui_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xui
      POSTGRES_PASSWORD: xui
      POSTGRES_DB: xui
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xui"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped
