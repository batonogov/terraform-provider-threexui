name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md
      - compat-versions.json
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - docker-compose.yaml
      - Taskfile.yml
      - .golangci.yml
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
      - CHANGELOG.md
      - compat-versions.json

# Cancel superseded runs on the same PR/branch — avoids wasting minutes
# and burning the GHCR pull quota on stale commits when force-pushing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # Required for docker/login-action to authenticate against ghcr.io with
  # GITHUB_TOKEN — anonymous ghcr pulls share a low rate limit per runner
  # IP and were the root cause of intermittent "API rate limit exceeded"
  # failures on the compat matrix.
  packages: read

# Every `arduino/setup-task` step below passes `repo-token: ${{
# secrets.GITHUB_TOKEN }}`. Authenticated requests get a much higher
# GitHub API rate limit; without the token, setup-task fetches release
# metadata anonymously and shares a low per-IP quota with every other
# Actions runner — observed as "API rate limit exceeded" failures on
# the compat matrix (issue #161).

jobs:
  validate-versions:
    name: Validate compat-versions.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check version surfaces are in sync
        run: scripts/sync-versions.sh check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

      - run: task fmt
      - name: Verify gofmt produced no changes
        run: git diff --exit-code -- main.go provider
      - run: task vet
      - run: task lint
      - run: task build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Run unit tests with coverage
        run: task test:unit:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: [lint]
    # Must cover (timeout_minutes × max_attempts) of the retry wrapper
    # below, plus a few minutes of setup. Otherwise the job-level cap
    # kills the second attempt mid-flight.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-job retry catches the residual flake rate after the in-process
      # retry/poll budgets are exhausted (issue #161): GHCR pull jitter,
      # one-off SQLite contention spikes, transient xray-subsystem startup
      # races. A green retry should produce *no* difference in code behavior;
      # if it does, that is a real bug and the diff between attempts will
      # show it. max_attempts=2 is the cheap-insurance setting.
      - name: Run acceptance tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 19
          max_attempts: 2
          retry_on: error
          command: task test:acc

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 3xui-container-logs-acceptance
          path: .pi/artifacts/3xui-container.log
          include-hidden-files: true
          retention-days: 7

  acceptance-tests-postgres:
    name: Acceptance Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [lint]
    # Same budget rule as the SQLite job above.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run acceptance tests with PostgreSQL
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 19
          max_attempts: 2
          retry_on: error
          command: task test:acc:postgres

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 3xui-container-logs-postgres
          path: .pi/artifacts/3xui-container.log
          include-hidden-files: true
          retention-days: 7

  acceptance-matrix-prepare:
    name: Prepare compat matrix
    runs-on: ubuntu-latest
    needs: [lint, validate-versions]
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set
        run: |
          MATRIX=$(jq -c '[.versions[] | select(.supported == true) | .version]' compat-versions.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  acceptance-matrix:
    name: Compat (${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: [lint, acceptance-matrix-prepare]
    # Must cover (timeout_minutes × max_attempts) of the retry wrapper
    # below, plus a few minutes of setup. Otherwise the job-level cap
    # kills the second attempt mid-flight.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Source of truth: compat-versions.json (validated by validate-versions job)
        version: ${{ fromJson(needs.acceptance-matrix-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }} # see top-of-file note

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run compatibility tests
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          THREEXUI_VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          timeout_minutes: 19
          max_attempts: 2
          retry_on: error
          command: task test:acc:compat

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 3xui-container-logs-${{ matrix.version }}
          path: .pi/artifacts/3xui-container.log
          include-hidden-files: true
          retention-days: 7
